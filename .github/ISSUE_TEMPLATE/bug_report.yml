name: Bug Report
description: Create a bug report to help us improve ahocorasick_rs
title: "[BUG]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        **Thank you for reporting this issue!**
        To help us understand and address the problem effectively, please provide detailed information.
        You can refer to [this guide](https://stackoverflow.com/help/mcve) for tips on creating a good bug report.

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: "Please provide the following details:"
      value: |
        - ahocorasick_rs version: [e.g. 1.0.3]
        - Python version: [e.g. 3.13]
        - Operating system: [e.g. Ubuntu 24.04]
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps To Reproduce
      description: Please provide a minimal, self-contained reproducer if possible.
      placeholder: |
        1. Include a minimal Python example or steps.
        2. Explain the exact error message or current behavior.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context (Optional)
      description: Add any other context about the problem here, including log outputs or screenshots if applicable.
    validations:
      required: false
